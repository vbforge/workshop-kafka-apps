server:
  port: 8082

spring:
  application:
    name: consumer-app
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: message-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false          # MUST be false when using AckMode.MANUAL
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.vbforge.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vbforge.consumerapp.model.MessageEvent
    listener:
      ack-mode: MANUAL                   # commit only after explicit acknowledgement in listener
      concurrency: 3                     # number of consumer threads (keep <= partition count)

logging:
  level:
    com.vbforge.consumerapp: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
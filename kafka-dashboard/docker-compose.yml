version: '3.8'

networks:
  kafka-dashboard-net:
    driver: bridge

services:

  kafka:
    image: confluentinc/cp-kafka:8.0.0
    container_name: kafka-dashboard-broker
    hostname: kafka
    restart: unless-stopped
    networks:
      - kafka-dashboard-net
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9099:9099"
    environment:
      CLUSTER_ID: "DashboardCluster001"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9099"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9099
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 2
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  conduktor-postgres:
    image: postgres:14
    container_name: conduktor-postgres-dashboard
    restart: unless-stopped
    networks:
      - kafka-dashboard-net
    volumes:
      - conduktor-pg-data-dashboard:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: conduktor-console
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor"]
      interval: 10s
      timeout: 5s
      retries: 5

  conduktor-console:
    image: conduktor/conduktor-console:1.36.2
    container_name: conduktor-console-dashboard
    restart: unless-stopped
    networks:
      - kafka-dashboard-net
    ports:
      - "8085:8080"
    volumes:
      - conduktor-data-dashboard:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor123@conduktor-postgres:5432/conduktor-console"
      CDK_CLUSTERS_0_ID: "dashboard-cluster"
      CDK_CLUSTERS_0_NAME: "Kafka Dashboard Cluster"
      CDK_CLUSTERS_0_COLOR: "#e74c3c"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "PLAINTEXT://kafka:19092"
    depends_on:
      kafka:
        condition: service_healthy
      conduktor-postgres:
        condition: service_healthy

volumes:
  conduktor-pg-data-dashboard:
  conduktor-data-dashboard: